name: Desktop printing
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: print-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@44a7db40b1a3e99eed02c88f89f38cdd6cfffe81
    with:
      os: '["windows-2022"]'
      timeout-minutes: 90
      craft-fonts-ref: ''
      tools: ''
      targets: ''
      command: 'cargo clippy --locked -p vectorcraft --all-targets -- -D warnings

        cargo test --locked -p vectorcraft

        log="$RUNNER_TEMP/printps.log"

        cargo test --locked -p vectorcraft-ui-egui --lib -- tests::printps | tee "$log"

        grep -Eq ''test result: ok\. [1-9][0-9]* passed'' "$log" || { echo "::error::tests::printps matched no tests"; exit 1; }

        '
