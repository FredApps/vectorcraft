name: HPGL consumer exploratory validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hpgl-consumer-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cad:
    if: github.repository == 'FredApps/vectorcraft' && github.ref == 'refs/heads/diagnostic/hpgl2-consumer'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@2c06746765d368723dc28ac3a44b04f841bec4da
    with:
      os: '["ubuntu-24.04"]'
      select-os: '[]'
      timeout-minutes: 25
      gate-timeout-minutes: 20
      toolchain: '1.95'
      targets: ''
      tools: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      free-disk-space: false
      cache-name: hpgl-consumer-check
      command: bash scripts/hpgl-consumer-check.sh
