name: Windows ARM64
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-arm64:
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@eddaf203b2d4873525a69842240214b23bac65ba
    with:
      app-name: vectorcraft
      app-dir: VectorCraft
      install-relative-path: Programs/ArtCraft/VectorCraft
      install-scope: perUser
